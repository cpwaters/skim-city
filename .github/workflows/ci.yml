name: CI

# Runs on every PR, and on any branch that isn't main. Pushes to main go
# straight to deploy.yml, which repeats these checks before shipping.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Firebase web config. These are public identifiers that ship inside the JS
  # bundle — they identify the project, they do not authorise anything, which
  # is why they are repository *variables* rather than secrets. Access control
  # lives in firestore.rules and the admin-claim checks in Cloud Functions.
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

jobs:
  verify:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix functions ci

      - name: Sync shared domain types
        # web/src/types/domain.ts and functions/src/domain.ts are generated and
        # gitignored, so nothing typechecks until this runs.
        run: npm run sync:types

      - name: Lint
        run: npm --prefix web run lint

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Build web app
        # Fails deliberately if the Firebase config is missing or still on
        # placeholders — see the guard in web/vite.config.ts.
        run: npm --prefix web run build

      - name: Set up Java for the Firestore emulator
        # The Firestore emulator is a Java process, and firebase-tools 15 needs
        # a JDK 21 or newer runtime. The runner's default JDK is older, so it
        # has to be set explicitly or emulators:exec refuses to start.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run security rules tests
        # emulators:exec boots Firestore, runs the suite, and tears it down,
        # so the tests exercise the real rules file rather than a mock.
        run: npx --yes firebase-tools@15.28.2 emulators:exec --only firestore --project skimcity-bac3b "npm test"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
