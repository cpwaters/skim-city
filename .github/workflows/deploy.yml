name: Deploy

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys race each other onto the same site.
  group: deploy-production
  cancel-in-progress: false

env:
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
  FIREBASE_PROJECT: skimcity-bac3b

jobs:
  # ---------------------------------------------------------------------------
  # Everything here works on the free Spark plan.
  # ---------------------------------------------------------------------------
  site:
    name: Site, rules and indexes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://skimcity-bac3b.web.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix functions ci

      - name: Sync shared domain types
        run: npm run sync:types

      - name: Set up Java for the Firestore emulator
        # The Firestore emulator is a Java process, and firebase-tools 15 needs
        # a JDK 21 or newer runtime. The runner's default JDK is older, so it
        # has to be set explicitly or emulators:exec refuses to start.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify before shipping
        # The same checks CI runs. A push straight to main must not skip them.
        run: |
          npm --prefix web run lint
          npm --prefix functions run build
          npx --yes firebase-tools@15.28.2 emulators:exec --only firestore --project "$FIREBASE_PROJECT" "npm test"

      - name: Build web app
        run: npm --prefix web run build

      - name: Authenticate to Firebase
        uses: ./.github/actions/firebase-auth
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        # Rules go out before the site: if a release tightens a rule, it should
        # be live before the code that depends on it.
        run: |
          npx --yes firebase-tools@15.28.2 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      - name: Deploy Storage rules
        # Split from Firestore because the two fail independently. Deploying
        # storage rules first reads the project's default bucket, so a project
        # without Storage enabled — or a deploy credential missing
        # firebasestorage.defaultBucket.get — took the Firestore rules down
        # with it. Still blocking: storage.rules is what guards the job photos.
        run: |
          npx --yes firebase-tools@15.28.2 deploy \
            --only storage \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      - name: Deploy hosting
        run: |
          npx --yes firebase-tools@15.28.2 deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --message "${{ github.sha }}"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Site: https://skimcity-bac3b.web.app"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Cloud Functions require the Blaze (pay-as-you-go) plan, because they make
  # outbound calls to Square, Stripe, Resend and Telegram. Until the project is
  # upgraded this job is skipped rather than failing the whole deploy — the
  # marketing site still ships. Set the repository variable DEPLOY_FUNCTIONS to
  # "true" once Blaze is enabled.
  # ---------------------------------------------------------------------------
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: site
    if: vars.DEPLOY_FUNCTIONS == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Sync shared domain types
        run: npm run sync:types

      - name: Authenticate to Firebase
        uses: ./.github/actions/firebase-auth
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions
        # Secret *values* are never passed from CI. They live in Google Secret
        # Manager, set once with `firebase functions:secrets:set NAME`, and the
        # deployed function is granted access to them by name.
        run: |
          npx --yes firebase-tools@15.28.2 deploy \
            --only functions \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
